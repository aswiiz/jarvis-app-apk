name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: '[ -d "android" ] || npx cap add android'

      - name: Set app icon and permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for PERM in "android.permission.INTERNET" "android.permission.ACCESS_NETWORK_STATE" "android.permission.RECORD_AUDIO" "android.permission.CAMERA" "android.permission.MODIFY_AUDIO_SETTINGS" "android.permission.VIBRATE" "android.permission.READ_MEDIA_IMAGES" "android.permission.READ_EXTERNAL_STORAGE"; do
            grep -q "$PERM" "$MANIFEST" || \
              sed -i "s#<application#<uses-permission android:name=\"$PERM\" />\n    <application#" "$MANIFEST"
          done
          grep -q "android.speech.RecognitionService" "$MANIFEST" || \
            sed -i "s#</manifest>#    <queries>\n        <intent>\n            <action android:name=\"android.speech.RecognitionService\" />\n        </intent>\n    </queries>\n</manifest>#" "$MANIFEST"

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
